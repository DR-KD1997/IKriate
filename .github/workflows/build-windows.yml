#
# Windows x64 build of IKriate (Qt 6).
#
# Follows upstream Krita's CI (build-tools/ci-scripts/windows.yml): the ~90
# third-party dependencies are not built here but downloaded as prebuilt
# packages from KDE's public package registry (teams/ci-artifacts/krita-windows),
# using Krita's own krita-deps-management / krita-ci-utilities tooling.
# The Qt 6 packages come from the dependency branch "transition.now/qt6",
# exactly like upstream's windows-build-qt6 job (build-tools/ci-scripts/windows.yml).
#
# Those packages are built with llvm-mingw (clang 21); the compiler here must
# match. If the dependency packages move to a newer toolchain, bump
# LLVM_MINGW_VERSION to the matching llvm-mingw release.
name: Windows (x64)

# For now only release tags and manual runs build this platform; pushes to
# main build Android only (Android-first testing).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # lets tagged builds attach their package to the release

concurrency:
  group: windows-${{ github.ref }}
  # Let long builds on main finish; only superseded pull-request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LLVM_MINGW_VERSION: '20251216'
  DEPS_BRANCH: transition.now/qt6
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    env:
      KDECI_BUILD_TYPE: Release
      KDECI_GITLAB_SERVER: https://invent.kde.org/
      KDECI_PACKAGE_PROJECT: teams/ci-artifacts/krita-windows
      KDECI_REPO_METADATA_PATH: ${{ github.workspace }}\krita-deps-management\repo-metadata
      KDECI_CACHE_PATH: C:\kdeci\artifacts
      # KDECI_CC_CACHE is deliberately unset: it switches Krita's runner to ccache,
      # which is not reliably on PATH for its subprocesses on hosted Windows runners.
      KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD: 'False'
      KDECI_EXTRA_CMAKE_ARGS: -DHIDE_SAFE_ASSERTS=ON -DBUILD_TESTING=OFF -DBUILD_WITH_QT6=ON -DALLOW_UNSTABLE=QT6 -DIKRIATE_ICF=safe
      # Tests are not built (BUILD_TESTING=OFF); skip the test-runner phase.
      KDECI_ONLY_BUILD: 'True'
      KRITACI_SKIP_DEBUG_PACKAGE: 'True'
      KRITACI_BUILD_INSTALLERS: 'False'
      # Debug info is split off (not shipped): KDE's prebuilt dependency DLLs
      # carry DWARF sections. KRITACI_SKIP_DEBUG_PACKAGE drops the .debug files.
      KRITACI_SKIP_UPLOAD_NIGHTLY_PACKAGE: 'True'
      # Krita's scripts read GitLab CI variables; map the GitHub equivalents.
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install llvm-mingw toolchain
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip" -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\tools
          "C:\tools\$name\bin" | Out-File -Append $env:GITHUB_PATH
          "C:\tools\$name\x86_64-w64-mingw32\bin" | Out-File -Append $env:GITHUB_PATH
          New-Item -ItemType Directory -Force $env:KDECI_CACHE_PATH | Out-Null
          "CI_COMMIT_SHORT_SHA=$($env:GITHUB_SHA.Substring(0,8))" | Out-File -Append $env:GITHUB_ENV
          choco install ninja -y --no-progress

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: C:\kdeci
          key: kdeci-windows-${{ env.DEPS_BRANCH }}-${{ hashFiles('.kde-ci.yml') }}
          restore-keys: kdeci-windows-${{ env.DEPS_BRANCH }}-

      - name: Fetch Krita CI tooling
        run: |
          git clone --depth=1 -b $env:DEPS_BRANCH https://invent.kde.org/packaging/krita-deps-management.git
          git clone --depth=1 https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities
          python -m venv venv --upgrade-deps
          ./venv/Scripts/Activate.ps1
          pip install -r krita-deps-management/requirements.txt
          pip install -r build-tools/ci-scripts/requirements-windows.txt
          # Needed when the Python scripting plugins are built after install.
          pip install setuptools

      - name: Build IKriate
        run: |
          ./venv/Scripts/Activate.ps1
          git config --global --add safe.directory $env:CI_PROJECT_DIR
          # Krita's runner fetches +refs/heads/* like GitLab CI does, which needs a detached HEAD.
          git checkout --quiet --detach
          python -u krita-deps-management/tools/replace-branch-in-seed-file.py krita-deps-management/latest/krita-deps.yml -p -o branch-corrected-deps.yml -d $env:DEPS_BRANCH
          python -u krita-deps-management/tools/generate-deps-file.py -s branch-corrected-deps.yml -o .kde-ci.yml
          python -u krita-deps-management/ci-utilities/run-ci-build.py --project krita --branch $env:DEPS_BRANCH --platform Windows/Qt5/Shared --skip-publishing 2>&1 | Tee-Object -FilePath build-ikriate.log

      - name: Package (portable zip)
        run: |
          ./venv/Scripts/Activate.ps1
          python -u build-tools/ci-scripts/build-windows-package.py 2>&1 | Tee-Object -FilePath build-package.log

      - name: Size report
        continue-on-error: true
        run: |
          $zip = Get-ChildItem ikriate-x64-*.zip | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries
          $lines = @("### Windows package size", '```', "$($zip.Name): $([math]::Round($zip.Length/1MB,1)) MB")
          $lines += "-- by folder (uncompressed / compressed MB)"
          $entries | Group-Object { ($_.FullName -split '/')[1..2] -join '/' } |
            ForEach-Object { [pscustomobject]@{ n=$_.Name; u=($_.Group | Measure-Object Length -Sum).Sum; c=($_.Group | Measure-Object CompressedLength -Sum).Sum } } |
            Sort-Object c -Descending | Select-Object -First 15 |
            ForEach-Object { $lines += ("{0,8:N1} {1,8:N1}  {2}" -f ($_.u/1MB), ($_.c/1MB), $_.n) }
          $lines += "-- largest files (compressed MB)"
          $entries | Sort-Object CompressedLength -Descending | Select-Object -First 20 |
            ForEach-Object { $lines += ("{0,8:N1}  {1}" -f ($_.CompressedLength/1MB), $_.FullName) }
          $lines += '```'
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: ikriate-windows-qt6-x64
          path: |
            ikriate-x64-*.zip
            ikriate-x64-*-setup.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ikriate-x64-*.zip
          fail_on_unmatched_files: true

      - name: Report failure
        if: failure()
        run: python .github/scripts/report-log.py build-package.log build-ikriate.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-build-logs
          path: '*.log'
