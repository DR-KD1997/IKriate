#
# Linux build of IKriate (Qt 6), packaged as an AppImage.
# Builds inside an Ubuntu 26.04 container, whose Qt 6.10 and KDE Frameworks 6
# packages (including Immer, Zug and Lager) are all Krita 6 needs. This is the
# same setup as the reference build in packaging/README-IKRIATE.md.
# The AppImage bundles Qt and needs a distribution with glibc 2.42 or newer.
name: Linux (AppImage)

# For now only release tags and manual runs build this platform; pushes to
# main build Android only (Android-first testing).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # lets tagged builds attach their package to the release

concurrency:
  group: linux-${{ github.ref }}
  # Let long builds on main finish; only superseded pull-request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 4G

jobs:
  appimage:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
      options: --privileged   # FUSE-free AppImage tools still need /dev access
    timeout-minutes: 350
    defaults:
      run:
        shell: bash   # implies -eo pipefail, so "| tee" keeps failures visible
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git wget file xz-utils zstd squashfs-tools python3 \
            build-essential lld ccache ninja-build cmake extra-cmake-modules gettext patchelf desktop-file-utils pkg-config \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-declarative-private-dev qt6-svg-dev \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-5compat-dev qt6-multimedia-dev qt6-wayland-dev \
            qml6-module-qtqml-workerscript qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-shapes qml6-module-qtquick-templates qml6-module-qtquick-window libqt6svgwidgets6 qt6-svg-plugins \
            libkf6colorscheme-dev libkf6completion-dev libkf6config-dev libkf6coreaddons-dev libkf6crash-dev \
            libkf6guiaddons-dev libkf6i18n-dev libkf6itemmodels-dev libkf6itemviews-dev libkf6widgetsaddons-dev \
            libkf6windowsystem-dev libkdcrawqt6-dev libimmer-dev libzug-dev liblager-dev libkseexpr-dev \
            libboost-dev libeigen3-dev libexiv2-dev liblcms2-dev libfftw3-dev libgsl-dev \
            libheif-dev libjxl-dev libopenexr-dev libopenjp2-7-dev libpng-dev libtiff-dev libwebp-dev \
            libgif-dev libjpeg-dev libturbojpeg0-dev libpoppler-qt6-dev libraw-dev libquazip1-qt6-dev libmypaint-dev \
            libopencolorio-dev libharfbuzz-dev libfreetype-dev libfontconfig-dev libunibreak-dev \
            libxsimd-dev libsdl2-dev libfribidi-dev libx11-dev libxi-dev zlib1g-dev

      - uses: actions/checkout@v4

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-qt6-${{ github.sha }}
          restore-keys: ccache-linux-qt6-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_WITH_QT6=ON -DALLOW_UNSTABLE=QT6 \
            -DIKRIATE_ICF=safe \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=OFF -DFOUNDATION_BUILD=ON 2>&1 | tee configure.log

      - name: Build
        run: cmake --build build --parallel 4 2>&1 | tee build.log

      - name: Install into AppDir
        # --strip: linuxdeploy only strips libraries it deploys itself, so the
        # ~170 plugin modules would otherwise ship with symbol tables.
        run: DESTDIR="$PWD/AppDir" cmake --install build --strip

      - name: Package AppImage
        run: |
          exec > >(tee appimage.log) 2>&1
          set -x
          wget -nv https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -nv https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          # Containers lack FUSE; unpack the tool AppImages instead of mounting them.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export NO_APPSTREAM=1
          export QMAKE=/usr/lib/qt6/bin/qmake6
          export EXTRA_QT_MODULES="svgwidgets"
          export EXTRA_PLATFORM_PLUGINS="libqwayland.so"   # Qt 6.8+ name
          export EXTRA_QT_PLUGINS="svg;iconengines;wayland-shell-integration;wayland-decoration-client;wayland-graphics-integration-client"
          export QML_SOURCES_PATHS="$PWD/plugins:$PWD/libs"
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib:$PWD/AppDir/usr/lib/x86_64-linux-gnu"
          export OUTPUT="IKriate-${GITHUB_REF_NAME//\//-}-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/org.kde.krita.desktop \
            --icon-file krita/pics/branding/IKriate/256-apps-krita.png --icon-filename krita \
            --plugin qt
          # Pack with zstd at its highest level and 1 MiB blocks instead of the
          # default (level 15, 128 KiB): about 7% smaller, same decompression speed.
          ./linuxdeploy-x86_64.AppImage --appimage-extract >/dev/null   # unpacks into squashfs-root/
          ARCH=x86_64 squashfs-root/plugins/linuxdeploy-plugin-appimage/usr/bin/appimagetool \
            --comp zstd --mksquashfs-opt -Xcompression-level --mksquashfs-opt 22 \
            --mksquashfs-opt -b --mksquashfs-opt 1M -n AppDir "$OUTPUT"
          ls -la *.AppImage

      - name: Size report
        continue-on-error: true
        run: |
          {
            echo "### Linux package size"
            echo '```'
            ls -la IKriate-*.AppImage
            for d in usr usr/lib usr/lib/kritaplugins usr/share usr/share/krita usr/share/locale; do du -sh "AppDir/$d"; done
            echo "-- largest files"
            find AppDir -type f -printf '%s %P\n' | sort -rn | head -25 | numfmt --to=iec --field=1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ikriate-linux-qt6-x86_64
          path: IKriate-*.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IKriate-*.AppImage
          fail_on_unmatched_files: true

      - name: Report failure
        if: failure()
        run: python3 .github/scripts/report-log.py appimage.log build.log configure.log
